document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sform:translateY(14px)}to{opacity:1;transform:none}}\n@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}\n@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}\n@keyframes swirl{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}\n@keyframes swirl2{from{transform:rotate(120deg) scale(1.05)}to{transform:rotate(480deg) scale(1.05)}}\n@keyframes ripple{from{transform:scale(.6);opacity:.8}to{transform:scale(1.9);opacity:0}}\n@keyframes blob{0%,100%{border-radius:44% 56% 58% 42%/48% 44% 56% 52%}33%{border-radius:56% 44% 42% 58%/52% 58% 42% 48%}66%{border-radius:48% 52% 55% 45%/44% 52% 48% 56%}}\n@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}\n@keyframes springIn{0%{opacity:0;transform:scale(.86)}60%{opacity:1;transform:scale(1.02)}100%{transform:scale(1)}}\n@keyframes shimmer{from{background-position:-400px 0}to{background-position:400px 0}}\n@keyframes popCheck{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}\n@keyframes wavebar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}\n@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:.95}}\n@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}\n@keyframes dashDraw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}\n#mc-print{display:none}\n@media print{\n  @page{margin:18mm}\n  body{background:#fff!important}\n  body *{visibility:hidden!important}\n  #mc-print,#mc-print *{visibility:visible!important}\n  #mc-print{display:block!important;position:absolute;inset:0;padding:0;z-index:9999}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 600px at 8% -5%, rgba(41,184,197,.14), transparent 60%),radial-g a Larbi<br>Psychiatre<br>13 juillet 2026<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-num);font-size:18px;font-weight:600;margin-bottom:6px\">{{ prTitre }}<\u002Fdiv>\n      <div style=\"font-size:12px;color:#5f7182;margin-bottom:22px\">{{ prSub }}<\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.85;white-space:pre-line\">{{ prCorps }}<\u002Fdiv>\n      <div style=\"margin-top:48px;display:flex;justify-content:flex-end\"><div style=\"text-align:center\"><div style=\"font-size:12px;color:#5f7182\">Dr N. Larbi<\u002Fdiv><div style=\"width:180px;border-top:1px solid #0B1B2B;margin-top:34px;padding-top:5px;font-size:10.5px;color:#9db0bd\">Signature &amp; cachet<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- ═══ VERROUILLAGE ═══ -->\n<sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:linear-gradient(150deg,#0a2530 0%,#0E7C8C 55%,#3d4291 130%);animation:fadeIn .3s ease both\">\n    <div style=\"position:absolute;inset:0;background:radial-gradient(700px 500px at 30% 20%, rgba(79,216,232,.16), transparent 60%),radial-gradient(600px 460px at 75% 85%, rgba(124,111,232,.2), transparent 60%)\"><\u002Fdiv>\n    <div style=\"position:relative;width:380px;max-width:90vw;border-radius:28px;background:rgba(255,255,255,.1);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.22);box-shadow:0 40px 100px rgba(0,0,0,.4);padding:36px 34px;text-align:center;animation:springIn .4s cubic-bezier(.34,1.4,.5,1) both\">\n      <img src=\"91841c48-0650-4f0b-a7b4-1aba63992034\" alt=\"Mindcare Center\" style=\"width:76px;height:76px;border-radius:22px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.35)\">\n      <div style=\"font-family:var(--font-num);font-size:19px;font-weight:600;color:#fff;letter-spacing:.05em;margin-top:16px\">MINDCARE <span style=\"color:var(--cyan)\">OS<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.65);text-transform:uppercase;margin-top:3px\">Session verrouillée<\u002Fdiv>\n      <div style=\"display:flex;justify-content:center;gap:12px;margin:26px 0\">\n        <sc-for list=\"{{ pinDots }}\" as=\"d\" hint-placeholder-count=\"4\"><span style=\"{{ d.st }}\"><\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:230px;margin:0 auto\">\n        <sc-for list=\"{{ pinKeys }}\" as=\"k\" hint-placeholder-count=\"12\">\n          <sc-if value=\"{{ k.notEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ k.go }}\" style=\"height:56px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.09);cursor:pointer;border-radius:16px;font-size:19px;font-weight:600;color:#fff\" style-hover=\"background:rgba(255,255,255,.2)\">{{ k.k }}<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ k.empty }}\" hint-placeholder-val=\"{{ false }}\"><span><\u002Fspan><\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;color:rgba(255,255,255,.55);margin-top:22px\">Saisissez 4 chiffres (démo) · Données chiffrées en Algérie 🇩🇿<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"dashboard\", tab: \"apercu\", patientId: null, anim: 0, tick: 0,\n    patients: [], journal: [], threads: [], demandes: [], charges: [],\n    notifOpen: false, globalSearch: \"\",\n    jarvisOpen: false, jarvisState: \"repos\", jarvisMsgs: [\n      { de: \"jarvis\", m: \"Bonjour Docteur. Votre après-midi compte quatre séances, la première à 14 h avec Mme Bouzid — son dossier pré-visite est prêt. Trois éléments attendent votre validation.\" },\n    ],\n    approval: null, toasts: [], dosage: null, chargeModal: null, cloture: null,\n    docPreview: null, agentPanel: null, agentChatIdx: {}, agentTyping: false,\n    patientView: \"table\", patientSearch: \"\", patientFilter: \"tous\",\n    commThread: \"t1\", commSent: {}, commText: \"\",\n    locked: false, pin: \"\",\n    listening: false, micErr: null, transcript: \"\",\n    finTab: \"vue\", validated: {}, echAssign: null,\n    settingsTab: \"profil\", testStates: {}, voix: \"Amel\", agendaVue: \"semaine\",\n  };\n\n  componentDidMount() {\n    const M = window.MC;\n    this.setState({\n      patients: M.getPatients().map(p => ({ ...p, meds: p.meds.map(m => ({ ...m })) })),\n      journal: M.getJournal().slice(), threads: M.getThreads().map(t => ({ ...t, msgs: t.msgs.slice() })),\n      demandes: M.getDemandesRdv().slice(), charges: M.getFinances().charges.slice(),\n    });\n    this.runCount();\n    this._t = [];\n  }\n  componentWillUnmount() { (this._t || []).forEach(clearTimeout); clearInterval(this._ci); clearInterval(this._li); try { speechSynthesis.cancel(); } catch (e) {} }\n  later(fn, ms) { const id = setTimeout(fn, ms); (this._t = this._t || []).push(id); return id; }\n\n  runCount() {\n    const t0 = performance.now(), dur = 1100;\n    const step = (t) => {\n      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);\n      this.setState({ tick: e });\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  nav(screen, extra) {\n    this.setState(s => ({ screen, notifOpen: false, anim: s.anim + 1, tick: 0, ...(extra || {}) }));\n    this.later(() => this.runCount(), 30);\n  }\n  openPatient(id) { this.nav(\"patient360\", { patientId: id, tab: \"apercu\" }); }\n\n  toast(t, type) {\n    const id = Date.now() + Math.random();\n    this.setState(s => ({ toasts: [...s.toasts, { id, t, type: type || \"ok\" }] }));\n    this.later(() => this.setState(s => ({ toasts: s.toasts.filter(x => x.id !== id) })), 4200);\n  }\n  addJournal(qui, action, cible) {\n    const h = new Date().toLocaleTimeString(\"fr-FR\", { hour: \"2-digit\", minute: \"2-digit\" }).replace(\":\", \":\");\n    this.setState(s => ({ journal: [{ id: \"j\" + Date.now(), h, qui, type: qui === \"Dr Larbi\" ? \"humain\" : \"agent\", action, cible, statut: \"exécuté\", chaine: [\"proposé\", \"confirmé\", \"exécuté\"] }, ...s.journal] }));\n  }\n\n  /* ---------- Approbations ---------- */\n  propose(ap) { this.setState({ approval: ap }); }\n  confirmApproval() {\n    const ap = this.state.approval; if (!ap) return;\n    this.setState({ approval: null });\n    this.addJournal(ap.par || \"Jarvis\", ap.t, ap.cible || \"—\");\n    this.toast(ap.toast || \"Action exécutée et consignée au journal.\");\n    if (ap.after) ap.after();\n    if (ap.source === \"jarvis\") {\n      this.pushJarvis(\"jarvis\", \"C'est fait. L'action a été exécutée et consignée au journal d'activité.\");\n      this.speak(\"C'est fait. L'action est consignée au journal.\");\n    }\n  }\n  cancelApproval() {\n    const ap = this.state.approval;\n    this.setState({ approval: null, jarvisState: this.state.jarvisOpen || this.state.screen === \"jarvis\" ? \"repos\" : this.state.jarvisState });\n    if (ap && ap.source === \"jarvis\") this.pushJarvis(\"jarvis\", \"Très bien, j'annule. Rien n'a été envoyé ni modifié.\");\n  }\n\n  /* ---------- Jarvis ---------- */\n  pushJarvis(de, m) { this.setState(s => ({ jarvisMsgs: [...s.jarvisMsgs, { de, m }] })); }\n  speak(text) {\n    try {\n      speechSynthesis.cancel();\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = \"fr-FR\"; u.rate = 1.02; u.pitch = 1.05;\n      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith(\"fr\"));\n      if (vs.length) u.voice = vs.find(v => /amelie|audrey|thomas|google/i.test(v.name)) || vs[0];\n      u.onstart = () => this.setState({ jarvisState: \"parle\" });\n      u.onend = () => this.setState(s => ({ jarvisState: s.approval ? \"action\" : \"repos\" }));\n      speechSynthesis.speak(u);\n    } catch (e) { this.setState({ jarvisState: \"repos\" }); }\n  }\n  ask(script) {\n    if (this.state.jarvisState === \"reflexion\") return;\n    this.pushJarvis(\"vous\", script.q);\n    this.setState({ jarvisState: \"reflexion\" });\n    this.later(() => {\n      this.pushJarvis(\"jarvis\", script.r);\n      this.speak(script.r);\n      if (script.action && script.action.type === \"approbation\") {\n        this.later(() => {\n          this.setState({ jarvisState: \"action\" });\n          this.propose({ t: script.action.t, detail: script.action.detail, cible: script.action.cible, source: \"jarvis\", par: \"Jarvis\", toast: \"Confirmé — Jarvis a exécuté l'action.\" });\n        }, 1400);\n      } else if (script.action && script.action.type === \"ouvrir\") {\n        this.later(() => this.openPatient(script.action.cible), 2600);\n      }\n    }, 1300);\n  }\n  listen() {\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if (!SR) { this.toast(\"La reconnaissance vocale n'est pas disponible dans ce navigateur — utilisez les commandes suggérées.\", \"warn\"); return; }\n    if (this.state.listening) { try { this._rec && this._rec.stop(); } catch (e) {} return; }\n    const rec = new SR(); this._rec = rec;\n    rec.lang = \"fr-FR\"; rec.interimResults = true;\n    rec.onstart = () => this.setState({ listening: true, jarvisState: \"ecoute\", transcript: \"\" });\n    rec.onresult = (ev) => {\n      const tr = Array.from(ev.results).map(r => r[0].transcript).join(\" \");\n      this.setState({ transcript: tr });\n      if (ev.results[ev.results.length - 1].isFinal) { rec.stop(); this.route(tr); }\n    };\n    rec.onerror = () => { this.setState({ listening: false, jarvisState: \"repos\" }); this.toast(\"Micro indisponible — vérifiez l'autorisation du navigateur.\", \"warn\"); };\n    rec.onend = () => this.setState({ listening: false });\n    rec.start();\n  }\n  route(tr) {\n    const t = tr.toLowerCase(); const S = window.MC.getJarvisScripts();\n    let s = null;\n    if (/encaiss|semaine|combien/.test(t)) s = S[0];\n    else if (/bouzid|dossier|14/.test(t)) s = S[1];\n    else if (/d[ée]cale|16|demain matin|rendez/.test(t)) s = S[2];\n    else if (/compte.rendu|hamidi|envoie/.test(t)) s = S[3];\n    else if (/net|r[ée]sultat|mois/.test(t)) s = { q: tr, r: \"Votre résultat net provisoire pour juillet est de 325 000 dinars : 421 500 encaissés moins 96 500 de charges. Vous êtes à 68 % de votre objectif mensuel, avec encore douze jours ouvrés.\" };\n    if (s) { this.ask({ ...s, q: tr }); }\n    else {\n      this.pushJarvis(\"vous\", tr);\n      this.setState({ jarvisState: \"reflexion\" });\n      this.later(() => {\n        const r = \"Je peux vous renseigner sur vos encaissements, préparer un dossier, déplacer un rendez-vous ou envoyer un document — essayez par exemple : « Combien j'ai encaissé cette semaine ? »\";\n        this.pushJarvis(\"jarvis\", r); this.speak(r);\n      }, 900);\n    }\n  }\n\n  /* ---------- Dosage ---------- */\n  openDosage(pid, med) {\n    const n = parseFloat(med.dosage);\n    const step = n >= 100 ? 50 : n >= 50 ? 25 : n >= 10 ? 5 : 2;\n    this.setState({ dosage: { pid, medId: med.id, molecule: med.molecule, unit: med.dosage.replace(/[\\d.,\\s]+/, \"\"), current: n, value: n, step, motif: \"\" } });\n  }\n  dosageStep(d) { this.setState(s => ({ dosage: { ...s.dosage, value: Math.max(s.dosage.step, s.dosage.value + d * s.dosage.step) } })); }\n  confirmDosage() {\n    const d = this.state.dosage; if (!d) return;\n    const p = this.state.patients.find(x => x.id === d.pid);\n    this.propose({\n      t: \"Ajuster la \" + d.molecule.toLowerCase() + \" : \" + d.current + \" → \" + d.value + \" \" + d.unit,\n      detail: \"Nouvelle ordonnance pour \" + p.prenom + \" \" + p.nom + \" · \" + d.molecule + \" \" + d.value + \" \" + d.unit + \" — \" + (d.motif || \"ajustement thérapeutique\") + \". L'ordonnance mise à jour sera générée et archivée au dossier.\",\n      cible: \"Dossier patient + ordonnance PDF\", par: \"Dr Larbi\",\n      toast: \"Ordonnance mise à jour — \" + d.molecule + \" \" + d.value + \" \" + d.unit + \".\",\n      after: () => this.setState(s => ({\n        dosage: null,\n        patients: s.patients.map(pt => pt.id !== d.pid ? pt : { ...pt, meds: pt.meds.map(m => m.id !== d.medId ? m : { ...m, dosage: d.value + \" \" + d.unit, depuis: \"13 juil. 2026\" }) }),\n      })),\n    });\n  }\n\n  /* ---------- Mode consultation (minuteur + transcription live + extraction) ---------- */\n  consultScript(p) {\n    const med = (p.meds[0] || {}).molecule || \"le traitement\";\n    const first = (p.prenom || \"\");\n    return {\n      lines: [\n        { s: \"doctor\", t: \"Bonjour, installez-vous. Comment vous êtes-vous senti depuis notre dernière séance ?\" },\n        { s: \"patient\", t: \"Un peu mieux je crois. Le sommeil revient doucement, mais j'ai encore des matinées difficiles.\" },\n        { s: \"doctor\", t: \"D'accord. Et concernant \" + med + \", vous le prenez toujours régulièrement ?\" },\n        { s: \"patient\", t: \"Oui, tous les matins. J'ai oublié une ou deux fois le week-end dernier.\" },\n        { s: \"doctor\", t: \"Des effets indésirables particuliers ? Nausées, fatigue en journée ?\" },\n        { s: \"patient\", t: \"Un peu de fatigue les premiers jours, ça s'est estompé. Sinon rien de spécial.\" },\n        { s: \"doctor\", t: \"Très bien. Vous avez repris le sport dont on avait parlé ?\" },\n        { s: \"patient\", t: \"Deux marches cette semaine. Ça m'a fait du bien, surtout le moral.\" },\n        { s: \"doctor\", t: \"Excellent. On va maintenir la posologie actuelle et se revoir dans trois semaines.\" },\n      ],\n      extraction: [\n        { type: \"symptom\", label: \"Amélioration du sommeil rapportée\", ic: \"trendUp\" },\n        { type: \"adherence\", label: \"Adhérence : 2 oublis le week-end\", ic: \"pill\" },\n        { type: \"side\", label: \"Effet indésirable transitoire (fatigue) — résolu\", ic: \"warn\" },\n        { type: \"lifestyle\", label: \"Reprise de l'activité physique (2 marches)\", ic: \"heart\" },\n        { type: \"decision\", label: \"Décision : posologie maintenue\", ic: \"check\" },\n        { type: \"followup\", label: \"Suivi : revoir sous 3 semaines\", ic: \"cal\" },\n      ],\n    };\n  }\n  startConsult(pid) {\n    const p = window.MC.getPatient(pid);\n    this._consultData = this.consultScript(p);\n    this.setState({ consult: { pid, seconds: 0, running: true, listening: true, lines: [], extracted: [] } });\n    this._ci = setInterval(() => this.setState(s => s.consult && s.consult.running ? { consult: { ...s.consult, seconds: s.consult.seconds + 1 } } : {}), 1000);\n    this._li = setInterval(() => this.streamConsult(), 2400);\n    this.later(() => this.streamConsult(), 500);\n  }\n  streamConsult() {\n    this.setState(s => {\n      if (!s.consult || !s.consult.running) return {};\n      const d = this._consultData; const i = s.consult.lines.length;\n      if (i >= d.lines.length) return {};\n      const lines = [...s.consult.lines, d.lines[i]];\n      const nExtract = Math.floor((i + 1) / 1.5);\n      const extracted = d.extraction.slice(0, Math.min(nExtract, d.extraction.length));\n      return { consult: { ...s.consult, lines, extracted } };\n    });\n  }\n  toggleConsult() { this.setState(s => ({ consult: { ...s.consult, running: !s.consult.running, listening: !s.consult.running } })); }\n  stopConsultTimers() { clearInterval(this._ci); clearInterval(this._li); }\n  finishConsult() {\n    const c = this.state.consult; if (!c) return;\n    this.stopConsultTimers();\n    const p = window.MC.getPatient(c.pid);\n    const civ = p.sexe === \"F\" ? (p.age < 20 ? \"Mlle\" : \"Mme\") : \"M.\";\n    const dur = this.fmtDur(c.seconds);\n    this.setState(s => ({ consult: { ...s.consult, running: false, listening: false } }));\n    this.propose({\n      t: \"Terminer la consultation — \" + civ + \" \" + p.nom,\n      detail: \"Durée : \" + dur + \" · audio supprimé, transcript chiffré conservé. Jarvis va générer automatiquement : compte-rendu clinique, note SOAP, mise à jour de la timeline et du jumeau numérique, ordonnance, reçu, tâches d'aftercare. Vous n'aurez qu'à valider.\",\n      cible: \"Dossier de \" + civ + \" \" + p.nom + \" · Finances · Agenda\", par: \"Jarvis\",\n      toast: \"Consultation clôturée — 6 documents générés, en attente de validation.\",\n      after: () => { this.setState({ consult: null }); this.addJournal(\"Jarvis\", \"Consultation clôturée (\" + dur + \") — CR, SOAP, ordonnance, reçu et tâches générés\", civ + \" \" + p.nom); },\n    });\n  }\n  cancelConsult() { this.stopConsultTimers(); this.setState({ consult: null }); }\n  fmtDur(s) { const m = Math.floor(s / 60), r = s % 60; return (m < 10 ? \"0\" : \"\") + m + \":\" + (r < 10 ? \"0\" : \"\") + r; }\n\n  /* ---------- Impression de documents ---------- */\n  doPrint(doc) {\n    this.setState({ printDoc: doc });\n    this.later(() => { try { window.print(); } catch (e) {} }, 160);\n  }\n\n  /* ---------- Communications ---------- */\n  approveDraft(th) {\n    this.propose({\n      t: \"Envoyer la réponse à \" + th.pnom, detail: th.brouillonIA, cible: th.canal + \" — \" + th.pnom, par: \"Agent Communications\",\n      toast: \"Message envoyé via \" + th.canal + \".\",\n      after: () => this.setState(s => ({\n        threads: s.threads.map(t => t.id !== th.id ? t : { ...t, nonLu: false, brouillonIA: null, msgs: [...t.msgs.filter(m => m.de !== \"note\"), { de: \"vous\", m: th.brouillonIA, h: \"à l'instant\" }] }),\n      })),\n    });\n  }\n  sendComm() {\n    const txt = this.state.commText.trim(); if (!txt) return;\n    this.setState(s => ({ commText: \"\", threads: s.threads.map(t => t.id !== s.commThread ? t : { ...t, msgs: [...t.msgs, { de: \"vous\", m: txt, h: \"à l'instant\" }] }) }));\n    this.addJournal(\"Dr Larbi\", \"Message envoyé\", \"Communica poser seulement\", 1], [\"Semi-autonome\", 2], [\"Autonome sur tâches approuvées\", 3]].map(([l, v]) => ({ l,\n          st: \"flex:1;text-align:center;border:none;cursor:pointer;font-size:11.5px;font-weight:600;padding:9px 6px;border-radius:11px;line-height:1.3;\" + (a.autonomie === v ? \"background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff\" : \"background:rgba(14,124,140,.06);color:var(--muted)\"),\n          go: () => this.toast(\"Niveau d'autonomie : « \" + l + \" » (appliqué à la connexion n8n).\", \"warn\") })),\n        agpSaveConfig: () => { this.toast(\"Configuration de l'agent enregistrée.\"); this.setState({ agentPanel: null }); },\n        icoBotAgp: this.icon(\"bot\", 15), icoSendAgp: this.icon(\"send\", 14),\n      });\n    } else out.hasAgentPanel = false;\n    // Mode consultation\n    const cs = S.consult;\n    if (cs) {\n      const p = pById(cs.pid) || {};\n      const civ2 = p.sexe === \"F\" ? (p.age < 20 ? \"Mlle\" : \"Mme\") : \"M.\";\n      const extIc = { symptom: \"trendUp\", adherence: \"pill\", side: \"warn\", lifestyle: \"heart\", decision: \"check\", followup: \"cal\" };\n      const extCol = { symptom: \"var(--ok)\", adherence: \"var(--violet)\", side: \"var(--warn)\", lifestyle: \"var(--teal)\", decision: \"var(--ok)\", followup: \"var(--teal-deep)\" };\n      Object.assign(out, {\n        hasConsult: true, csPatient: civ2 + \" \" + p.prenom + \" \" + p.nom, csDx: p.dx, csIni: ini(p),\n        csTime: this.fmtDur(cs.seconds), csRunning: cs.running,\n        csOrb: this.orb(52), csWave: this.waveBars(\"var(--teal)\"),\n        csStateLabel: cs.running ? \"Écoute active — transcription en direct\" : \"En pause\",\n        csLines: cs.lines.map(l => ({ t: l.t, tag: l.s === \"doctor\" ? \"Dr Larbi\" : \"Patient\",\n          wrapSt: \"display:flex;justify-content:\" + (l.s === \"doctor\" ? \"flex-start\" : \"flex-end\"),\n          tagSt: \"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:\" + (l.s === \"doctor\" ? \"var(--teal-deep)\" : \"var(--violet)\") + \";margin-bottom:3px\",\n          bubSt: \"max-width:80%;font-size:13px;line-height:1.55;padding:10px 14px;border-radius:14px;background:\" + (l.s === \"doctor\" ? \"rgba(41,184,197,.09);border:1px solid rgba(41,184,197,.2)\" : \"rgba(124,111,232,.08);border:1px solid rgba(124,111,232,.2)\") })),\n        csExtracted: cs.extracted.map(e => ({ label: e.label, ic: this.icon(extIc[e.type] || \"spark\", 14),\n          st: \"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid var(--line);animation:cardIn .4s ease both\",\n          icSt: \"flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;background:\" + (extCol[e.type] || \"var(--teal)\") })),\n        csEmpty: cs.lines.length === 0,\n        csToggle: () => this.toggleConsult(), csFinish: () => this.finishConsult(), csCancel: () => this.cancelConsult(),\n        csToggleLabel: cs.running ? \"Pause\" : \"Reprendre\",\n        icoPauseCs: this.icon(cs.running ? \"x\" : \"play\", 14), icoStopCs: this.icon(\"check\", 15), icoSparkCs: this.icon(\"spark\", 13),\n      });\n    } else out.hasConsult = false;\n    // Impression\n    const pd = S.printDoc;\n    if (pd) Object.assign(out, { hasPrint: true, prTitre: pd.titre, prSub: pd.sub || pd.patient || \"\", prCorps: pd.corps || \"\" });\n    else out.hasPrint = false;\n    return out;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
