# sharp : dépendance optionnelle de Next (optimisation d'image), non utilisée
# en Phase 1 (aucune image livrée) — postinstall refusé, surface réduite sur le
# poste qui héberge aussi la base clinique.
allowBuilds:
  # esbuild : transpileur de Vitest (lanceur de tests unitaires). Son binaire
  # natif est posé par son postinstall ; sans lui, `pnpm test` ne démarre pas.
  # Autorisé pour cette raison précise, et pour aucune autre.
  esbuild: true
  protobufjs: true
  sharp: false
  # unrs-resolver : binaire natif requis par l'outillage ESLint/Next
  # (résolution de modules) — seul postinstall autorisé.
  unrs-resolver: true
